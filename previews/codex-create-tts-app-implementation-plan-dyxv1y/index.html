<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple TTS App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <section class="card" aria-labelledby="app-title">
      <p class="eyebrow">Browser Text to Speech</p>
      <h1 id="app-title">간단한 TTS 앱</h1>
      <p class="description">읽고 싶은 문장을 입력한 뒤 읽기 버튼을 누르면 브라우저가 문장을 읽어줍니다.</p>

      <form class="tts-form">
        <label for="tts-text">읽을 문장</label>
        <textarea id="tts-text" name="tts-text" rows="7" placeholder="예: 안녕하세요. 간단한 TTS 앱입니다."></textarea>

        <div class="actions">
          <button type="button" id="speak-button" class="primary-button">읽기</button>
          <button type="button" class="secondary-button">중지</button>
        </div>
      </form>

      <section class="status-panel" aria-live="polite" aria-label="현재 상태">
        <span class="status-label">현재 상태</span>
        <p id="status-message">대기 중입니다.</p>
      </section>
    </section>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
