<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple TTS App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <section class="card" aria-labelledby="app-title">
      <p class="eyebrow">Browser Text to Speech</p>
      <h1 id="app-title">간단한 TTS 앱</h1>
      <p class="description">읽고 싶은 문장을 입력한 뒤 버튼을 눌러보세요. 실제 음성 읽기 기능은 다음 단계에서 연결합니다.</p>

      <form class="tts-form">
        <label for="tts-text">읽을 문장</label>
        <textarea id="tts-text" name="tts-text" rows="7" placeholder="예: 안녕하세요. 간단한 TTS 앱입니다."></textarea>

        <div class="actions">
          <button type="button" class="primary-button">읽기</button>
          <button type="button" class="secondary-button">중지</button>
        </div>
      </form>

      <section class="status-panel" aria-live="polite" aria-label="현재 상태">
        <span class="status-label">현재 상태</span>
        <p>대기 중입니다.</p>
      </section>
    </section>
  </main>
</body>
</html>
